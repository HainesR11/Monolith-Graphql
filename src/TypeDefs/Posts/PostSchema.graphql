type User {
  name: String
}

type Post {
  id: ID!
  author: User
  title: String
  image: String
  content: String
  createdAt: String
  updatedAt: String
  commentCount: Int
  likedCount: Int
}

type Comment {
  id: ID!
  postId: ID!
  userId: String
  content: String
  createdAt: String
}

type Query {
  posts(limit: Int, offset: Int): [Post]
  post(id: ID!): Post
  comments(postId: ID!, limit: Int, offset: Int): [Comment]
}

type Mutation {
  # Post Mutations
  createPost(userId: ID!, content: String): String
  updatePost(id: ID!, content: String): String
  deletePost(id: ID!): String

  likePost(postId: ID!, userId: ID!): String
  unlikePost(postId: ID!, userId: ID!): String

  addComment(postId: ID!, userId: ID!, content: String): String
  deleteComment(id: ID!): String
  updateComment(id: ID!, content: String): String
}
